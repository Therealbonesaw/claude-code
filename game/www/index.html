<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Sky Dash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100dvh;
    }
    #ad-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-family: sans-serif;
      font-size: 12px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <!-- AdMob banner placeholder — replaced by real ad in native app -->
  <div id="ad-banner">Advertisement</div>

  <!-- Capacitor runtime (injected automatically when built natively) -->
  <script>
    // AdMob helper — works in both native (Capacitor) and browser preview
    const AdMobHelper = (() => {
      let admob = null;

      async function init() {
        try {
          const { AdMob } = await import('../node_modules/@capacitor-community/admob/dist/esm/index.js');
          admob = AdMob;
          await admob.initialize({ testingDevices: [], initializeForTesting: false });

          // Prepare interstitial ahead of time
          await admob.prepareInterstitial({
            adId: 'ca-app-pub-3381371694059037/8071734151'
          });
        } catch {
          // Running in browser preview — no-op
        }
      }

      async function showBanner() {
        if (!admob) return;
        try {
          await admob.showBanner({
            adId: 'ca-app-pub-3381371694059037/9826498098',
            adSize: 'BANNER',
            position: 'BOTTOM_CENTER'
          });
          // Hide the HTML placeholder banner when real ad shows
          document.getElementById('ad-banner').style.display = 'none';
        } catch {}
      }

      async function showInterstitial() {
        if (!admob) return;
        try {
          await admob.showInterstitial();
          // Re-prepare for next time
          await admob.prepareInterstitial({
            adId: 'ca-app-pub-3381371694059037/8071734151'
          });
        } catch {}
      }

      init().then(showBanner);
      return { showInterstitial };
    })();
  </script>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Responsive canvas: fill screen minus ad banner
    const AD_HEIGHT = 50;
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - AD_HEIGHT;
    }
    resize();
    window.addEventListener('resize', () => { resize(); if (state === 'dead') drawDead(); });

    // ── Constants ─────────────────────────────────────────────────────────────
    const GRAVITY       = 0.5;
    const FLAP_POWER    = -10;
    const PIPE_WIDTH    = 60;
    const PIPE_GAP      = 160;   // vertical gap between pipes
    const PIPE_SPEED    = 3;
    const PIPE_INTERVAL = 90;    // frames between new pipes
    const BIRD_R        = 18;    // bird radius
    const BIRD_X        = 90;

    // ── State ─────────────────────────────────────────────────────────────────
    let state = 'idle';  // idle | playing | dead
    let bird, pipes, score, bestScore, frame, particles;

    function initGame() {
      bird = { y: canvas.height / 2, vy: 0, angle: 0 };
      pipes = [];
      score = 0;
      frame = 0;
      particles = [];
    }

    bestScore = parseInt(localStorage.getItem('skydash_best') || '0');

    // ── Input ─────────────────────────────────────────────────────────────────
    function flap() {
      if (state === 'idle') {
        state = 'playing';
        bird.vy = FLAP_POWER;
        return;
      }
      if (state === 'playing') {
        bird.vy = FLAP_POWER;
        spawnParticles(BIRD_X, bird.y, '#ffe066', 6);
        return;
      }
      if (state === 'dead') {
        initGame();
        state = 'playing';
      }
    }

    canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });
    canvas.addEventListener('mousedown',  e => flap());
    document.addEventListener('keydown',  e => { if (e.code === 'Space') flap(); });

    // ── Particles ─────────────────────────────────────────────────────────────
    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1,
          color
        });
      }
    }

    function updateParticles() {
      for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function drawParticles() {
      for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ── Pipes ─────────────────────────────────────────────────────────────────
    function spawnPipe() {
      const minY = 60;
      const maxY = canvas.height - PIPE_GAP - 60;
      const gapY = minY + Math.random() * (maxY - minY);
      pipes.push({ x: canvas.width, gapY, scored: false });
    }

    function updatePipes() {
      if (frame % Math.max(40, PIPE_INTERVAL - Math.floor(score / 5)) === 0) spawnPipe();
      for (let p of pipes) p.x -= PIPE_SPEED + score * 0.03;
      pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);
    }

    function drawPipe(p) {
      const grad1 = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
      grad1.addColorStop(0, '#3ddc84');
      grad1.addColorStop(0.5, '#5ff2a0');
      grad1.addColorStop(1, '#2aad5e');

      // Top pipe
      ctx.fillStyle = grad1;
      ctx.beginPath();
      ctx.roundRect(p.x, 0, PIPE_WIDTH, p.gapY, [0, 0, 8, 8]);
      ctx.fill();
      // Cap
      ctx.fillStyle = '#2aad5e';
      ctx.beginPath();
      ctx.roundRect(p.x - 5, p.gapY - 24, PIPE_WIDTH + 10, 24, 4);
      ctx.fill();

      // Bottom pipe
      const botY = p.gapY + PIPE_GAP;
      ctx.fillStyle = grad1;
      ctx.beginPath();
      ctx.roundRect(p.x, botY, PIPE_WIDTH, canvas.height - botY, [8, 8, 0, 0]);
      ctx.fill();
      // Cap
      ctx.fillStyle = '#2aad5e';
      ctx.beginPath();
      ctx.roundRect(p.x - 5, botY, PIPE_WIDTH + 10, 24, 4);
      ctx.fill();
    }

    // ── Bird ──────────────────────────────────────────────────────────────────
    function updateBird() {
      bird.vy += GRAVITY;
      bird.y += bird.vy;
      bird.angle = Math.min(Math.PI / 2.5, Math.max(-0.4, bird.vy * 0.07));

      // Floor/ceiling
      if (bird.y - BIRD_R < 0 || bird.y + BIRD_R > canvas.height) die();
    }

    function drawBird() {
      ctx.save();
      ctx.translate(BIRD_X, bird.y);
      ctx.rotate(bird.angle);

      // Body
      const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, BIRD_R);
      grad.addColorStop(0, '#ffe566');
      grad.addColorStop(1, '#f0a500');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(7, -6, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(9, -5, 3, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ff7700';
      ctx.beginPath();
      ctx.moveTo(14, -2);
      ctx.lineTo(24, 2);
      ctx.lineTo(14, 6);
      ctx.closePath();
      ctx.fill();

      // Wing
      ctx.fillStyle = '#f0a500';
      ctx.beginPath();
      ctx.ellipse(-4, 4, 12, 6, -0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ── Collision ─────────────────────────────────────────────────────────────
    function checkCollisions() {
      for (let p of pipes) {
        const bx = BIRD_X, by = bird.y, r = BIRD_R - 3;
        const inXRange = bx + r > p.x && bx - r < p.x + PIPE_WIDTH;
        if (inXRange && (by - r < p.gapY || by + r > p.gapY + PIPE_GAP)) {
          die();
          return;
        }
        if (!p.scored && p.x + PIPE_WIDTH < BIRD_X) {
          p.scored = true;
          score++;
          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('skydash_best', bestScore);
          }
        }
      }
    }

    function die() {
      state = 'dead';
      spawnParticles(BIRD_X, bird.y, '#ffe066', 20);
      spawnParticles(BIRD_X, bird.y, '#ff4444', 15);

      // Show interstitial ad every 3 deaths
      deathCount++;
      if (deathCount % 3 === 0) showInterstitialAd();
    }

    let deathCount = 0;

    function showInterstitialAd() {
      // Show real AdMob ad in native app, fallback mock in browser
      AdMobHelper.showInterstitial();
      const el = document.createElement('div');
      el.style.cssText = `
        position:fixed;inset:0;background:rgba(0,0,0,0.85);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        color:#fff;font-family:sans-serif;z-index:999;
      `;
      el.innerHTML = `
        <div style="font-size:13px;color:#aaa;margin-bottom:8px;">ADVERTISEMENT</div>
        <div style="font-size:22px;font-weight:bold;">Ad would appear here</div>
        <div style="font-size:13px;color:#aaa;margin-top:4px;">(AdMob in production)</div>
        <button style="margin-top:24px;padding:12px 32px;background:#3ddc84;border:none;
          border-radius:24px;font-size:16px;font-weight:bold;cursor:pointer;" onclick="this.parentElement.remove()">
          ✕ Close
        </button>
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ── Background ────────────────────────────────────────────────────────────
    let bgOffset = 0;
    const clouds = Array.from({ length: 6 }, () => ({
      x: Math.random() * 800,
      y: Math.random() * 200 + 20,
      r: Math.random() * 40 + 20,
      speed: Math.random() * 0.4 + 0.2
    }));

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#1a1a2e');
      sky.addColorStop(1, '#16213e');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for (let i = 0; i < 40; i++) {
        const sx = ((i * 137 + bgOffset * 0.1) % canvas.width);
        const sy = (i * 71) % (canvas.height * 0.6);
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Clouds
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      for (let c of clouds) {
        ctx.beginPath();
        ctx.arc(c.x % (canvas.width + 100) - 50, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
        c.x -= c.speed;
        if (c.x < -100) c.x = canvas.width + 100;
      }
    }

    // ── UI ────────────────────────────────────────────────────────────────────
    function drawScore() {
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(canvas.width * 0.12)}px Arial`;
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 8;
      ctx.fillText(score, canvas.width / 2, 80);
      ctx.restore();
    }

    function drawIdle() {
      drawBackground();
      drawBird();
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(canvas.width * 0.1)}px Arial`;
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 10;
      ctx.fillText('SKY DASH', canvas.width / 2, canvas.height * 0.35);
      ctx.font = `${Math.round(canvas.width * 0.055)}px Arial`;
      ctx.fillStyle = '#ffe066';
      ctx.fillText('Tap to Start', canvas.width / 2, canvas.height * 0.52);
      if (bestScore > 0) {
        ctx.font = `${Math.round(canvas.width * 0.04)}px Arial`;
        ctx.fillStyle = '#aaa';
        ctx.fillText(`Best: ${bestScore}`, canvas.width / 2, canvas.height * 0.62);
      }
      ctx.restore();
    }

    function drawDead() {
      drawBackground();
      for (let p of pipes) drawPipe(p);
      drawParticles();

      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(canvas.width * 0.09)}px Arial`;
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 10;
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height * 0.3);

      ctx.font = `bold ${Math.round(canvas.width * 0.14)}px Arial`;
      ctx.fillStyle = '#ffe066';
      ctx.fillText(score, canvas.width / 2, canvas.height * 0.48);

      ctx.font = `${Math.round(canvas.width * 0.045)}px Arial`;
      ctx.fillStyle = '#aaa';
      ctx.fillText(`Best: ${bestScore}`, canvas.width / 2, canvas.height * 0.58);

      ctx.font = `${Math.round(canvas.width * 0.05)}px Arial`;
      ctx.fillStyle = '#3ddc84';
      ctx.fillText('Tap to Play Again', canvas.width / 2, canvas.height * 0.72);
      ctx.restore();
    }

    // ── Main Loop ─────────────────────────────────────────────────────────────
    function loop() {
      requestAnimationFrame(loop);
      bgOffset++;

      if (state === 'idle') {
        bird.y = canvas.height / 2 + Math.sin(Date.now() / 400) * 10;
        drawIdle();
        return;
      }

      if (state === 'playing') {
        updateBird();
        updatePipes();
        checkCollisions();
        updateParticles();
        frame++;

        drawBackground();
        for (let p of pipes) drawPipe(p);
        drawBird();
        drawParticles();
        drawScore();
        return;
      }

      if (state === 'dead') {
        updateParticles();
        drawDead();
        return;
      }
    }

    initGame();
    loop();
  </script>
</body>
</html>
